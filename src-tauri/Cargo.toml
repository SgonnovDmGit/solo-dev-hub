[package]
name = "solo-dev-hub"
version = "1.18.0"
description = "Solo Dev Hub — desktop app for managing GitHub projects"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "solo_dev_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# Credential store is chosen per OS. Without an explicit store feature keyring
# silently falls back to a non-persistent mock store, so every target must name one.
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
include_dir = "0.7"
aes-gcm = "0.10"
base64 = "0.22"

# Linux: Secret Service over D-Bus (GNOME Keyring / KWallet). Needs libdbus-1-dev to build.
# Cargo unifies features per target, so Windows builds still pull only windows-native.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

