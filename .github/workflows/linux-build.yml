name: Linux build

# Pre-release Linux artifacts: builds AppImage + deb on every push to dev and
# uploads them as workflow artifacts. Nothing is published to a GitHub release.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust tests
        working-directory: src-tauri
        # The full set: --include-ignored also runs the git-spawning contributor
        # tests that are ignored locally (slow on Windows). The schema generator
        # is an ignored non-test and needs an env var, so it is skipped.
        run: cargo test --lib -- --include-ignored --skip db::migrations::tests::export_fresh_schema_db

      - name: Build bundles
        # createUpdaterArtifacts needs the signing key; its password is empty.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: solo-dev-hub-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
