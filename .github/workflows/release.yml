name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # Windows bundle target (nsis) comes from tauri.conf.json.
            args: ''
          - platform: ubuntu-22.04
            # Oldest runner with webkit2gtk-4.1 = widest glibc compatibility.
            # The signed AppImage feeds the linux-x86_64 entry in latest.json.
            args: '--bundles appimage,deb'
          # macOS: two native builds on the Apple Silicon runner; each signed
          # .app.tar.gz feeds its own darwin-* entry in latest.json. Ad-hoc
          # signature (signingIdentity "-" in tauri.conf.json), not notarized.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # The *.ubuntu.com DNS zone itself went dark on hosted runners during
        # the v1.24.0 release (azure/archive/security all NXDOMAIN while
        # github.com and packages.microsoft.com resolved), and apt burned
        # ~75 min per job on per-package resolver timeouts. If the runner's
        # mirror does not resolve, swap all ubuntu sources to the OSUOSL
        # mirror — a non-ubuntu.com host whose DNS still resolves. apt
        # verifies the archive's GPG signatures, so the mirror's trust level
        # does not matter for package integrity.
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://ubuntu.osuosl.org/ubuntu|g' \
              -e 's|azure\.archive\.ubuntu\.com|ubuntu.osuosl.org|g' \
              -e 's|security\.ubuntu\.com|ubuntu.osuosl.org|g' \
              -e 's|archive\.ubuntu\.com|ubuntu.osuosl.org|g' \
              /etc/apt/sources.list
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev             libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # The two macOS rows share a platform; keep their caches apart.
          key: ${{ matrix.args }}

      - name: Extract release notes from Changelog.md
        id: notes
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting notes for version: $TAG_VERSION"
          node scripts/extract-changelog.mjs "$TAG_VERSION" > release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Solo Dev Hub ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # T-000251: during v1.24.0 the ubuntu leg died on an apt DNS outage and the
  # run still published a syntactically valid latest.json missing linux-* —
  # the updater then honestly answered "no update" to every Linux install.
  # A missing platform is a release failure, not a footnote: after ALL matrix
  # legs finish, assert the full key set (each leg merges only its own entries
  # into the manifest, so no leg can verify the others).
  verify-updater-manifest:
    name: Verify updater manifest
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Assert all platform keys in latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber
          required=(
            windows-x86_64 windows-x86_64-nsis
            linux-x86_64 linux-x86_64-appimage
            darwin-aarch64 darwin-aarch64-app
            darwin-x86_64 darwin-x86_64-app
          )
          missing=()
          for key in "${required[@]}"; do
            if ! jq -e --arg key "$key" \
              '.platforms[$key].signature and .platforms[$key].url' latest.json >/dev/null; then
              missing+=("$key")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::latest.json is missing platform entries: ${missing[*]}"
            echo "Catch-up path: build the platform via linux-build.yml on the tag's commit, upload the signed artifacts, then add the entries to latest.json — docs/RELEASING.md."
            exit 1
          fi
          echo "latest.json covers all ${#required[@]} platform keys"
