<text text-anchor="start" x="187.14" y="-86.2" font-family="Arial" font-size="14.00"> v34 — JSON map of the last imported blob sha per shared file, so an unchanged file is not imported again.</text>
<polygon fill="none" stroke="black" points="43.2,-43.2 43.2,-74 1941.19,-74 1941.19,-43.2 43.2,-43.2"/>
<text text-anchor="start" x="50.2" y="-55.4" font-family="Arial" font-size="14.00">share_specs </text>
<text text-anchor="start" x="133.47" y="-55.4" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="203.48" y="-55.4" font-family="Arial" font-size="14.00"> v35 (T&#45;000243) — per&#45;repo opt&#45;out for sharing docs/superpowers/ in contributor mode. 1 (default) = the folder travels with the shared set; 0 = specs stay local&#45;only. Independent of shared_mode: settable before sharing is enabled, so it lives on the row, not in shared_import JSON.</text>
