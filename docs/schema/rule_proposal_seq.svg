<text text-anchor="start" x="50.2" y="-733" font-family="Arial" font-size="14.00">project_id </text>
<text text-anchor="start" x="114.79" y="-733" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="184.8" y="-733" font-family="Arial" font-size="14.00"> ON DELETE SET NULL — the only non&#45;cascading FK in the schema. Deleting a project orphans its repositories rather than destroying them.</text>
<polygon fill="none" stroke="black" points="43.2,-690 43.2,-720.8 1941.19,-720.8 1941.19,-690 43.2,-690"/>
<text text-anchor="start" x="50.2" y="-702.2" font-family="Arial" font-size="14.00">github_name </text>
<text text-anchor="start" x="135.04" y="-702.2" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="178.6" y="-702.2" font-family="Arial" font-size="14.00"> UNIQUE, and nullable since v13 so local&#45;only repos (never pushed to GitHub) can exist. The last path segment is the canonical folder name used for all cross&#45;repo doc folders.</text>
<polygon fill="none" stroke="black" points="43.2,-659.2 43.2,-690 1941.19,-690 1941.19,-659.2 43.2,-659.2"/>
