<text text-anchor="start" x="171.59" y="-147.8" font-family="Arial" font-size="14.00"> v34 — cached role of THIS install for the repo: &#39;main&#39; (owner, publishes the structure), &#39;contributor&#39;, or &#39;pending&#39; (a contributor who has requested access). NULL means the repo is not shared.</text>
<polygon fill="none" stroke="black" points="43.2,-104.8 43.2,-135.6 1941.19,-135.6 1941.19,-104.8 43.2,-104.8"/>
