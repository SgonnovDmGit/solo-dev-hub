<text text-anchor="start" x="1247.24" y="-1131.6" font-family="Arial Bold" font-size="18.00">peer_channel_deliveries</text>
<text text-anchor="start" x="1422.15" y="-1131.6" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1453.27" y="-1131.6" font-family="Arial" font-size="14.00" fill="#666666">[table]</text>
<text text-anchor="start" x="53.2" y="-1117.2" font-family="Arial" font-size="14.00" fill="#333333">v37 (T&#45;000257) — delivery provenance of the outbox→inbox mirror, one row per file this install copied. The mirror&#39;s prune may only remove a file it delivered: &quot;absent from my local outbox&quot; is not a retraction when the inbox copy can be another machine&#39;s delivery that arrived through git (the REQ&#45;body ping&#45;pong). Keyed (src repo, dst repo, lane&#45;relative path) — installation&#45;local, never synced, immune to a peer&#45;folder rename.</text>
<polygon fill="none" stroke="black" points="46.2,-1077 46.2,-1107.8 2692.45,-1107.8 2692.45,-1077 46.2,-1077"/>
<text text-anchor="start" x="53.2" y="-1089.2" font-family="Arial" font-size="14.00">src_repo_id </text>
<text text-anchor="start" x="130.24" y="-1089.2" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="200.25" y="-1089.2" font-family="Arial" font-size="14.00"> The repo whose outbox the file was mirrored FROM.</text>
<polygon fill="none" stroke="black" points="46.2,-1046.2 46.2,-1077 2692.45,-1077 2692.45,-1046.2 46.2,-1046.2"/>
<text text-anchor="start" x="53.2" y="-1058.4" font-family="Arial" font-size="14.00">dst_repo_id </text>
<text text-anchor="start" x="130.25" y="-1058.4" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="200.26" y="-1058.4" font-family="Arial" font-size="14.00"> The repo whose inbox received the copy.</text>
<polygon fill="none" stroke="black" points="46.2,-1015.4 46.2,-1046.2 2692.45,-1046.2 2692.45,-1015.4 46.2,-1015.4"/>
<text text-anchor="start" x="53.2" y="-1027.6" font-family="Arial" font-size="14.00">rel_path </text>
<text text-anchor="start" x="107.68" y="-1027.6" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="151.24" y="-1027.6" font-family="Arial" font-size="14.00"> Path under the lane root (outbox|inbox/&lt;peer&gt;/), nested parts kept.</text>
<polygon fill="none" stroke="black" points="46.2,-984.6 46.2,-1015.4 2692.45,-1015.4 2692.45,-984.6 46.2,-984.6"/>
