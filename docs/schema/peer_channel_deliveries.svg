<text text-anchor="start" x="157.48" y="-996.8" font-family="Arial" font-size="14.00"> sha256 of the delivered bytes — a drifted file no longer matches and is left alone.</text>
<polygon fill="none" stroke="black" points="46.2,-953.8 46.2,-984.6 2692.45,-984.6 2692.45,-953.8 46.2,-953.8"/>
<text text-anchor="start" x="53.2" y="-966" font-family="Arial" font-size="14.00">delivered_at </text>
