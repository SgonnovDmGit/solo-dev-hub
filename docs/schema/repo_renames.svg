<text text-anchor="start" x="190.69" y="-147.8" font-family="Arial" font-size="14.00"> v34 — cached role of THIS install for the repo: &#39;main&#39; (owner, publishes the structure), &#39;contributor&#39;, or &#39;pending&#39; (a contributor who has requested access). NULL means the repo is not shared.</text>
<polygon fill="none" stroke="black" points="62.31,-104.8 62.31,-135.6 1960.3,-135.6 1960.3,-104.8 62.31,-104.8"/>
<text text-anchor="start" x="69.31" y="-117" font-family="Arial" font-size="14.00">shared_status </text>
