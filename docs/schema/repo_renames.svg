<text text-anchor="start" x="495.91" y="-86.2" font-family="Arial" font-size="14.00"> v34 — status code of the shared&#45;mode sync (e.g. &#39;needs_manual_merge&#39;); NULL means no pending condition.</text>
<polygon fill="none" stroke="black" points="353.52,-43.2 353.52,-74 1669.09,-74 1669.09,-43.2 353.52,-43.2"/>
<text text-anchor="start" x="360.52" y="-55.4" font-family="Arial" font-size="14.00">shared_import </text>
