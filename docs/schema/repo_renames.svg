<text text-anchor="start" x="481.9" y="-117" font-family="Arial" font-size="14.00"> v34 — cached role of THIS install for the repo: &#39;main&#39; (owner, publishes the structure), &#39;contributor&#39;, or &#39;pending&#39; (a contributor who has requested access). NULL means the repo is not shared.</text>
<polygon fill="none" stroke="black" points="353.52,-74 353.52,-104.8 1669.09,-104.8 1669.09,-74 353.52,-74"/>
<text text-anchor="start" x="360.52" y="-86.2" font-family="Arial" font-size="14.00">shared_status </text>
