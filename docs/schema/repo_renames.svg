<text text-anchor="start" x="495.12" y="-702.2" font-family="Arial" font-size="14.00"> ON DELETE SET NULL — the only non&#45;cascading FK in the schema. Deleting a project orphans its repositories rather than destroying them.</text>
<polygon fill="none" stroke="black" points="353.52,-659.2 353.52,-690 1669.09,-690 1669.09,-659.2 353.52,-659.2"/>
