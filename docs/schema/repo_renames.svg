<text text-anchor="start" x="53.2" y="-1086.4" font-family="Arial" font-size="14.00" fill="#333333">Append&#45;only log of repository renames, written when a known github_id shows up under a new github_name. The sync preamble replays every entry to rename cross&#45;repo folders on the counterparty&#39;s disk. There is deliberately no applied_at column — idempotency comes from filesystem checks, not DB state.</text>
