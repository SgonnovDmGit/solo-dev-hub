<text text-anchor="start" x="203.91" y="-733" font-family="Arial" font-size="14.00"> ON DELETE SET NULL — the only non&#45;cascading FK in the schema. Deleting a project orphans its repositories rather than destroying them.</text>
<polygon fill="none" stroke="black" points="62.31,-690 62.31,-720.8 1960.3,-720.8 1960.3,-690 62.31,-690"/>
