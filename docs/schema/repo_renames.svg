<text text-anchor="start" x="204.7" y="-117" font-family="Arial" font-size="14.00"> v34 — status code of the shared&#45;mode sync (e.g. &#39;needs_manual_merge&#39;); NULL means no pending condition.</text>
<polygon fill="none" stroke="black" points="62.31,-74 62.31,-104.8 1960.3,-104.8 1960.3,-74 62.31,-74"/>
<text text-anchor="start" x="69.31" y="-86.2" font-family="Arial" font-size="14.00">shared_import </text>
<text text-anchor="start" x="162.68" y="-86.2" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="206.24" y="-86.2" font-family="Arial" font-size="14.00"> v34 — JSON map of the last imported blob sha per shared file, so an unchanged file is not imported again.</text>
<polygon fill="none" stroke="black" points="62.31,-43.2 62.31,-74 1960.3,-74 1960.3,-43.2 62.31,-43.2"/>
<text text-anchor="start" x="69.31" y="-55.4" font-family="Arial" font-size="14.00">share_specs </text>
<text text-anchor="start" x="152.57" y="-55.4" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="222.58" y="-55.4" font-family="Arial" font-size="14.00"> v35 (T&#45;000243) — per&#45;repo opt&#45;out for sharing docs/superpowers/ in contributor mode. 1 (default) = the folder travels with the shared set; 0 = specs stay local&#45;only. Independent of shared_mode: settable before sharing is enabled, so it lives on the row, not in shared_import JSON.</text>
