<text text-anchor="start" x="445.36" y="-671.4" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="488.92" y="-671.4" font-family="Arial" font-size="14.00"> UNIQUE, and nullable since v13 so local&#45;only repos (never pushed to GitHub) can exist. The last path segment is the canonical folder name used for all cross&#45;repo doc folders.</text>
<polygon fill="none" stroke="black" points="353.52,-628.4 353.52,-659.2 1669.09,-659.2 1669.09,-628.4 353.52,-628.4"/>
