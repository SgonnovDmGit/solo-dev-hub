<text text-anchor="start" x="231.15" y="-301.8" font-family="Arial" font-size="14.00"> Lazy&#45;migration marker (v21). While NULL, the first task sync suppresses &#39;created&#39; events so backfilling legacy files doesn&#39;t flood the timeline.</text>
