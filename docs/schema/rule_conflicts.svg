<text text-anchor="start" x="53.2" y="-117.2" font-family="Arial" font-size="14.00" fill="#333333">v33 (T&#45;000206) — one row per rule whose hand&#45;backs currently conflict (two repos handed back different texts). Lets a repeated pass tell a conflict it already reported from a new one instead of raising the same error on every sync. The conflicting texts are not stored: they stay in the repo copies.</text>
