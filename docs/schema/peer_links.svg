<text text-anchor="start" x="684.67" y="-702.2" font-family="Arial" font-size="14.00">project_id </text>
<text text-anchor="start" x="749.26" y="-702.2" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="819.27" y="-702.2" font-family="Arial" font-size="14.00"> ON DELETE SET NULL — the only non&#45;cascading FK in the schema. Deleting a project orphans its repositories rather than destroying them.</text>
<polygon fill="none" stroke="black" points="677.67,-659.2 677.67,-690 1993.24,-690 1993.24,-659.2 677.67,-659.2"/>
<text text-anchor="start" x="684.67" y="-671.4" font-family="Arial" font-size="14.00">github_name </text>
<text text-anchor="start" x="769.51" y="-671.4" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="813.07" y="-671.4" font-family="Arial" font-size="14.00"> UNIQUE, and nullable since v13 so local&#45;only repos (never pushed to GitHub) can exist. The last path segment is the canonical folder name used for all cross&#45;repo doc folders.</text>
<polygon fill="none" stroke="black" points="677.67,-628.4 677.67,-659.2 1993.24,-659.2 1993.24,-628.4 677.67,-628.4"/>
