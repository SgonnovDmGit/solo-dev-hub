<text text-anchor="start" x="820.06" y="-86.2" font-family="Arial" font-size="14.00"> v34 — status code of the shared&#45;mode sync (e.g. &#39;needs_manual_merge&#39;); NULL means no pending condition.</text>
<polygon fill="none" stroke="black" points="677.67,-43.2 677.67,-74 1993.24,-74 1993.24,-43.2 677.67,-43.2"/>
