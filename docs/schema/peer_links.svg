<text text-anchor="start" x="53.2" y="-932.4" font-family="Arial" font-size="14.00" fill="#333333">Explicit peer pairing between two repositories for the InOutBox channel between equals (v31). Every pair is explicit: a row here is the only thing that opens a channel, exactly the way a microservice is connected. The relation is symmetric, so the pair is stored normalised (repo_a_id &lt; repo_b_id) and a CHECK enforces it; without that one logical pair could be stored twice and the channel would sync twice per pass.</text>
<polygon fill="none" stroke="black" points="46.2,-892.2 46.2,-923 2624.7,-923 2624.7,-892.2 46.2,-892.2"/>
