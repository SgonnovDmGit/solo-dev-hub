<text text-anchor="start" x="530.39" y="-86.2" font-family="Arial" font-size="14.00"> v34 — JSON map of the last imported blob sha per shared file, so an unchanged file is not imported again.</text>
<polygon fill="none" stroke="black" points="386.46,-43.2 386.46,-74 2284.45,-74 2284.45,-43.2 386.46,-43.2"/>
<text text-anchor="start" x="393.46" y="-55.4" font-family="Arial" font-size="14.00">share_specs </text>
