<text text-anchor="start" x="806.05" y="-117" font-family="Arial" font-size="14.00"> v34 — cached role of THIS install for the repo: &#39;main&#39; (owner, publishes the structure), &#39;contributor&#39;, or &#39;pending&#39; (a contributor who has requested access). NULL means the repo is not shared.</text>
<polygon fill="none" stroke="black" points="677.67,-74 677.67,-104.8 1993.24,-104.8 1993.24,-74 677.67,-74"/>
<text text-anchor="start" x="684.67" y="-86.2" font-family="Arial" font-size="14.00">shared_status </text>
