<text text-anchor="start" x="1079.43" y="-761" font-family="Arial" font-size="14.00" fill="#333333">A repository belonging to at most one project. May be GitHub&#45;backed or local&#45;only.</text>
<polygon fill="none" stroke="black" points="677.67,-720.8 677.67,-751.6 1993.24,-751.6 1993.24,-720.8 677.67,-720.8"/>
