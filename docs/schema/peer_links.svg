<text text-anchor="start" x="458.05" y="-733" font-family="Arial" font-size="14.00" fill="#666666">[INTEGER]</text>
<text text-anchor="start" x="528.05" y="-733" font-family="Arial" font-size="14.00"> ON DELETE SET NULL — the only non&#45;cascading FK in the schema. Deleting a project orphans its repositories rather than destroying them.</text>
<polygon fill="none" stroke="black" points="386.46,-690 386.46,-720.8 2284.45,-720.8 2284.45,-690 386.46,-690"/>
<text text-anchor="start" x="393.46" y="-702.2" font-family="Arial" font-size="14.00">github_name </text>
<text text-anchor="start" x="478.3" y="-702.2" font-family="Arial" font-size="14.00" fill="#666666">[TEXT]</text>
<text text-anchor="start" x="521.85" y="-702.2" font-family="Arial" font-size="14.00"> UNIQUE, and nullable since v13 so local&#45;only repos (never pushed to GitHub) can exist. The last path segment is the canonical folder name used for all cross&#45;repo doc folders.</text>
<polygon fill="none" stroke="black" points="386.46,-659.2 386.46,-690 2284.45,-690 2284.45,-659.2 386.46,-659.2"/>
