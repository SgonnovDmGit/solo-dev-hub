<text text-anchor="start" x="1263.33" y="-1070" font-family="Arial Bold" font-size="18.00">peer_links</text>
<text text-anchor="start" x="1338.31" y="-1070" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1369.43" y="-1070" font-family="Arial" font-size="14.00" fill="#666666">[table]</text>
<text text-anchor="start" x="53.2" y="-1055.6" font-family="Arial" font-size="14.00" fill="#333333">Explicit peer pairing between two repositories for the InOutBox channel between equals (v31). Every pair is explicit: a row here is the only thing that opens a channel, exactly the way a microservice is connected. The relation is symmetric, so the pair is stored normalised (repo_a_id &lt; repo_b_id) and a CHECK enforces it; without that one logical pair could be stored twice and the channel would sync twice per pass.</text>
<polygon fill="none" stroke="black" points="46.2,-1015.4 46.2,-1046.2 2624.7,-1046.2 2624.7,-1015.4 46.2,-1015.4"/>
