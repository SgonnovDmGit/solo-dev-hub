<text text-anchor="start" x="546.73" y="-55.4" font-family="Arial" font-size="14.00"> v35 (T&#45;000243) — per&#45;repo opt&#45;out for sharing docs/superpowers/ in contributor mode. 1 (default) = the folder travels with the shared set; 0 = specs stay local&#45;only. Independent of shared_mode: settable before sharing is enabled, so it lives on the row, not in shared_import JSON.</text>
